<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บัญชีรายรับ - รายจ่าย</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1 class="app-title">บัญชีรายรับ - รายจ่าย</h1>

        <section class="card balance-card">
            <p class="label">ยอดคงเหลือ</p>
            <p id="balance" class="balance">฿0.00</p>
            <div class="summary">
                <div>
                    <p class="label">รายรับ</p>
                    <p id="money-plus" class="money plus">฿0.00</p>
                </div>
                <div>
                    <p class="label">รายจ่าย</p>
                    <p id="money-minus" class="money minus">฿0.00</p>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>เพิ่มธุรกรรม</h2>
            <form id="form" novalidate>
                <div class="type-toggle" role="radiogroup" aria-label="ประเภทธุรกรรม">
                    <label class="type-option">
                        <input type="radio" name="type" value="expense" checked>
                        <span>รายจ่าย</span>
                    </label>
                    <label class="type-option">
                        <input type="radio" name="type" value="income">
                        <span>รายรับ</span>
                    </label>
                </div>
                <div class="form-control">
                    <label for="text">ชื่อธุรกรรม</label>
                    <input type="text" id="text" placeholder="เช่น ค่าข้าว, เงินเดือน" autocomplete="off">
                </div>
                <div class="form-control">
                    <label for="amount">จำนวนเงิน (บาท)</label>
                    <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
                </div>
                <p id="error" class="error" role="alert" hidden></p>
                <button type="submit" class="btn">เพิ่มธุรกรรม</button>
            </form>
        </section>

        <section class="card">
            <div class="list-header">
                <h2>ประวัติธุรกรรม</h2>
                <button type="button" id="clear-all" class="link-btn" hidden>ล้างทั้งหมด</button>
            </div>
            <ul id="list" class="list"></ul>
            <p id="empty" class="empty">ยังไม่มีธุรกรรม เริ่มเพิ่มรายการแรกได้เลย</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
